<div class="dock" draggable="false">
  @for (tool of actionTools; track $index) {
    <div class="tool" [class.disabled]="tool.inactive" draggable="false">
      <img
        style="height: 2.4rem"
        class="pt-2 pb-1 select-none cursor-pointer"
        draggable="false"
        [src]="tool.image"
        alt=""
        srcset=""
        (click)="onToolClick(tool)"
      />
      <div>
        <span class="select-none">{{ tool.name }}</span>
      </div>
    </div>
  }
</div>
