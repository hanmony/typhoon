<div
  class="right-panel overflow-y-auto overflow-x-hidden"
  [class.collapsed]="collapse()"
  [ngClass]="{ 'custom-scroll-bar': !collapse() }"
>
  <div [class.hidden]="collapse()">
    <div class="title">
      <div class="title-font">天气信息</div>
    </div>
    <occ-weather-info />
    <div class="title">
      <div class="title-font">{{ activeTabLabel() }}</div>
    </div>
    @if (activeTab() === "event-statistics") {
      <occ-event-statistics [events]="events()" />
    } @else if (activeTab() === "line-operation") {
      <occ-line-operation [operations]="operations()" />
    } @else if (activeTab() === "repair-statistics") {
      <occ-guard-repair [events]="events()" />
    }
  </div>
</div>
@if (!collapse()) {
  <div class="tabs">
    @for (tab of tabs; track tab.key) {
      <div
        class="tab"
        [class.active]="tab.key === activeTab()"
        (click)="setActiveTab(tab.key)"
      >
        <div class="font-inner">{{ tab.label }}</div>
      </div>
    }
  </div>
}
<div class="right-panel-toggle">
  <div class="delta"></div>
  <div
    class="toggle-icon"
    [class.collapsed]="collapse()"
    (click)="toggleCollapse()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 0 20 20"
      style="width: 20px; height: 20px"
    >
      <g fill="none">
        <path
          d="M13.75 4.75a.75.75 0 0 1 .743.648l.007.102v9a.75.75 0 0 1-1.493.102L13 14.5v-9a.75.75 0 0 1 .75-.75zm-8.28.22a.75.75 0 0 1 .976-.073l.084.073l4.5 4.5a.75.75 0 0 1 .073.976l-.073.084l-4.5 4.5a.75.75 0 0 1-1.133-.976l.073-.084L9.44 10L5.47 6.03a.75.75 0 0 1 0-1.06z"
          fill="currentColor"
        ></path>
      </g>
    </svg>
  </div>
</div>
