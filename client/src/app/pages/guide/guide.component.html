<div class="guide" [style.zoom]="zoom">
  <div
    class="flex-1 dark-bg dark-mode"
    style="width: 100%; height: 100%"
    #mapRef
  ></div>
  @if (detailInfo) {
    <div class="info">
      <div class="flex-1"></div>
      <guide-headline
        class="cursor-pointer"
        id="guide-headline"
        [name]="detailInfo.name"
        [level]="level"
        (click)="toFrontEndDetail()"
      />
      <div class="flex-1"></div>
      <guide-milestones class="milestones" [data]="detailInfo" />
      <div class="flex-1"></div>
      <guide-overview [data]="detailInfo" />
      <div class="flex-1"></div>
      <div class="w-full flex justify-center py-8">
        <div class="mr-[92px]" [class.invisible]="animationDone">
          <img
            class="cursor-pointer user-select-none transition-all hover:scale-105"
            src="assets/images/guide/break-animation-button.png"
            alt=""
            srcset=""
            draggable="false"
            (click)="terminateAnimation()"
          />
        </div>
        <div>
          <img
            class="cursor-pointer user-select-none transition-all hover:scale-105"
            src="assets/images/guide/to-detail-button.png"
            alt=""
            srcset=""
            draggable="false"
            (click)="toFrontEndDetail()"
          />
        </div>
      </div>
      <div class="flex-1"></div>
    </div>
  }
</div>
