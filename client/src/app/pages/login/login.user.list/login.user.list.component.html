<nz-list>
  <nz-list-item *ngFor="let user of users">
    <a (click)="select(user)" class="font-blue">
      <nz-space>
        <span *nzSpaceItem>
          {{ user.name }}
        </span>
        <span *nzSpaceItem>
          {{ user.id }}
        </span>
      </nz-space>
    </a>
    <ul nz-list-item-actions>
      <nz-list-item-action
        ><a (click)="remove(user)" class="font-blue">
          <span nz-icon nzType="delete" nzTheme="outline"></span>
        </a>
      </nz-list-item-action>
    </ul>
  </nz-list-item>
</nz-list>
