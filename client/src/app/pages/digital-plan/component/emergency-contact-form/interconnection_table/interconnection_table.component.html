<div class="interconnection-table">
  <div
    *ngFor="let group of groupedData; let i = index"
    class="line-section"
    [ngStyle]="{ '--order': i }"
  >
    <img *ngIf="group.iconPath" [src]="group.iconPath" class="line-icon" />
    <img
      src="/assets/images/digital-plan/caveEntranceTableBg1.png"
      alt=""
      class="line-img-header"
    />
    <div class="line-section-content">
      <div class="line-table">
        <div class="table-header">
          <div class="header-cell">车站</div>
          <div class="header-cell">位置</div>
          <div class="header-cell">联通情况</div>
          <div class="header-cell">公司</div>
          <div class="header-cell">车站联系人及电话</div>
          <div class="header-cell">商场联系人及电话</div>
        </div>
        <div *ngFor="let station of group.stations" class="table-row">
          <div class="table-cell">{{ getStationDisplay(station.station) }}</div>
          <div class="table-cell">
            <div *ngFor="let location of station.locations">{{ location }}</div>
          </div>
          <div class="table-cell">
            <div *ngFor="let status of station.connectionStatuses">
              {{ status }}
            </div>
          </div>
          <div class="table-cell">
            <div *ngFor="let company of station.companies">{{ company }}</div>
          </div>
          <div class="table-cell">
            <div *ngFor="let contact of station.stationContacts">
              {{ contact }}
            </div>
          </div>
          <div class="table-cell">
            <div *ngFor="let contact of station.mallContacts">
              {{ contact }}
            </div>
          </div>
        </div>
      </div>
    </div>
    <img
      src="/assets/images/digital-plan/caveEntranceTableBg3.png"
      alt=""
      class="line-img-footer"
    />
  </div>
</div>
