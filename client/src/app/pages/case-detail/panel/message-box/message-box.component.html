<div
  @horizontalInOutRelative
  class="message-box"
  (click)="handleClick()"
  [id]="'message-box-' + data.event._id"
  [class.unread]="false"
>
  @if (data.expired) {
    <div class="outdate"></div>
  }
  <div class="message-box-header"></div>
  <div class="message-box-body">
    <div class="headline">
      <span class="title">{{ title }}</span>
      <span class="time">{{ time }}</span>
    </div>
    <div class="message-box-content">
      <div class="detail-box whitespace-pre-wrap">
        @for (item of items; track $index) {
          <div
            class="message-item"
            [class]="{
              'inline-block': item.width !== 'full',
              'w-1/2': item.width === 'half',
              'w-1/3': item.width === '1/3',
              'w-full': item.width === 'full',
            }"
          >
            <div class="message-type">{{ item.label }}</div>
            <div class="message-text" [class.opacity-0]="item.value === '@@##'">
              {{ item.value }}
            </div>
          </div>
        }
      </div>
    </div>
  </div>
  <div class="message-box-footer"></div>
</div>
