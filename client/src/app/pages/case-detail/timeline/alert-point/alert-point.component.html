<div
  class="relative"
  style="animation-duration: 500ms"
  [class.animate-blink]="blink"
>
  @if (degree !== "lift") {
    <div class="relative -bottom-4 h-[70px]" style="max-width: 60px">
      <div
        class="select-none h-[70px] bg-center flex items-center justify-center pb-6"
        [class.cursor-pointer]="!ban"
        [class.cursor-not-allowed]="ban"
        draggable="false"
        [style.backgroundImage]="icon"
        alt=""
        srcset=""
      >
        @if (!hasSpecialIcon) {
          <span>{{ weatherTypeText }}</span>
        }
      </div>
    </div>
  } @else {
    <div class="relative bottom-[8px] text-center">
      <img
        class="cursor-pointer select-none"
        draggable="false"
        src="assets/images/map/timeline/lift.png"
        alt=""
        srcset=""
      />
    </div>
  }
  @if (sliceLeft || sliceRight) {
    <div
      class="absolute"
      style="color: var(--case-primary); left: 26px; top: 8px"
    >
      <span
        nz-icon
        nzType="vertical-align-top"
        class="text-lg"
        nzTheme="outline"
        [class.-rotate-90]="sliceLeft"
        [class.rotate-90]="sliceRight"
      ></span>
    </div>
  }
</div>
