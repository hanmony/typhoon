<div
  #wrapper
  class="filter-item"
  [class]="{
    'indent-left': !reverse,
    'indent-right': reverse,
    reverse: reverse,
    active: !isAllChecked,
    gray: isAllUnChecked && model.length,
    disabled: disabled,
  }"
  (click)="onClick()"
>
  <span>{{ label }}</span>
</div>
<div *ngIf="model.length" class="dropdown" [class]="{ reverse: reverse }">
  <div #dropdown @dropdown *ngIf="dropdownVisible" class="shining-box">
    <div class="bg-top px-[0.75rem] text-left pt-2">
      <div
        class="option-item h-full flex items-center"
        [class]="{
          checked: isAllChecked,
        }"
        (click)="toggleAll()"
      >
        <span
          nz-icon
          nzType="check-circle"
          [nzTheme]="isAllChecked ? 'fill' : 'outline'"
        ></span>
        <span class="ml-1"> 选择全部 </span>
      </div>
    </div>
    <div class="bg-center py-2 px-[1.25rem] text-left">
      @for (op of model; track $index) {
        <div
          class="option-item"
          [class]="{
            checked: op.checked,
            disabled: op.disabled,
          }"
          (click)="toggleItem(op)"
        >
          {{ op.label }}
        </div>
      }
    </div>
    <div class="bg-bottom"></div>
  </div>
</div>
