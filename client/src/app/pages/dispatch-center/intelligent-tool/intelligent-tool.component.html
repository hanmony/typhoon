<dispatch-module-header title="智慧工具" />
<div class="grid grid-cols-2 gap-x-6 gap-y-4 py-4">
  @for (t of tools(); track t.id) {
    <div class="team-item pt-2 min-w-32">
      <div
        class="flex items-center justify-center active:opacity-85 cursor-pointer"
        (click)="onToolClick(t)"
      >
        <img style="height: 64px" [src]="t.icon" alt="" srcset="" />
      </div>
      <div class="text-center">
        {{ t.name }}
      </div>
    </div>
  }
</div>
