<div #wrapper class="box" (click)="onClick()">
  <span>{{ label || placeholder }}</span>
  <span
    class="transition-transform"
    [class.rotate-90]="dropdownVisible"
    nz-icon
    nzType="caret-right"
    nzTheme="outline"
  ></span>
</div>
<div *ngIf="options.length" class="dropdown">
  <div #dropdown @dropdown *ngIf="dropdownVisible" class="shining-box">
    <div class="bg-center py-2 px-[1.25rem] text-left">
      @for (op of options; track $index) {
        <div
          class="option-item"
          [class]="{ checked: op.value === value }"
          (click)="handleSelect(op)"
        >
          {{ op.label }}
        </div>
      }
    </div>
  </div>
</div>
