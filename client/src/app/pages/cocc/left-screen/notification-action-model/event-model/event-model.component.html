<div class="statistical-box">
  <div class="modal-header">
    <div>
      <span>关联事件</span>
    </div>
    <div>
      <span class="mr-6">
        <img
          title="关闭"
          style="top: -2px"
          class="cursor-pointer relative hover:scale-110"
          src="/assets/images/map/modal/popup/close.png"
          alt=""
          srcset=""
          (click)="closeModel()"
        />
      </span>
    </div>
  </div>
  <div class="modal-body">
    <div class="tabs">
      @for (item of lines; track $index) {
        <div
          class="tab-item"
          [class.active]="activeLine() === item"
          (click)="activeLine.set(item)"
        >
          <span>
            {{ item }}
          </span>
        </div>
      }
    </div>
    <div class="px-6 pt-3">
      <table class="statistical-table w-full">
        <thead>
          <tr class="text-left">
            <th class="w-[64px] text-center">重点</th>
            <th class="w-[96px]">线路</th>
            <th class="w-[120px]">事件类型</th>
            <th>位置</th>
            <th class="w-[100px]">抢修状态</th>
            <th class="w-[120px]">操作</th>
          </tr>
        </thead>
        <tbody class="custom-scroll-bar">
          @for (row of tableEvents(); track $index) {
            <tr class="row" [class.terminated-font]="row.terminated">
              <th class="w-[64px] text-center">
                @if (row.severity) {
                  <span
                    class="w-3 h-3 rounded-full inline-flex items-center justify-center"
                    [style.background]="'#00ffff'"
                  >
                    <svg
                      style="width: 12px; height: 12px; color: #000000"
                      xmlns="http://www.w3.org/2000/svg"
                      xmlns:xlink="http://www.w3.org/1999/xlink"
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M5 12l5 5L20 7"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      ></path>
                    </svg>
                  </span>
                }
              </th>
              <td class="w-[96px]">
                {{ row.line }}
              </td>
              <td class="w-[120px]" [class.truncate]="true">
                {{ row.eventType }}
              </td>
              <td [class.truncate]="true">
                {{ getEventPosition(row) }}
              </td>
              <td
                class="w-[100px]"
                [style.color]="getEventRepairStateColor(row)"
              >
                {{ getEventRepairStateText(row) }}
              </td>
              <td class="w-[120px]">
                <span
                  nz-icon
                  title="关联通告"
                  nzType="link"
                  nzTheme="outline"
                  class="cursor-pointer mr-1 hover:text-[#00ffff91]"
                  [style.color]="
                    isEventSelected(row) ? '#00ffffe1' : '#ffffff91'
                  "
                  (click)="handleLinkEvent(row)"
                ></span>
                <button
                  nz-button
                  nzType="default"
                  nzSize="small"
                  [style.color]="
                    isEventSelected(row) ? '#ffffff91' : '#00ffffe1'
                  "
                  (click)="handleLinkEvent(row)"
                >
                  {{ isEventSelected(row) ? "取消关联" : "关联通告" }}
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
      @if (!tableEvents().length) {
        <div
          class="text-center font-fangzheng py-8"
          style="font-size: 32px; line-height: 1.5"
        >
          暂无数据
        </div>
      }
    </div>
  </div>
  <div class="modal-footer"></div>
</div>
