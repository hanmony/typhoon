<div class="check-all-radio">
  <svg
    class="cursor-pointer"
    style="width: 32px; height: 32px; color: #5fa3e8"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 24 24"
    (click)="handleCheckAll()"
  >
    <g fill="none">
      @if (allChecked()) {
        <path
          d="M18 3a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h12zm-1.53 4.97L10 14.44l-2.47-2.47a.75.75 0 0 0-1.06 1.06l3 3a.75.75 0 0 0 1.06 0l7-7a.75.75 0 0 0-1.06-1.06z"
          fill="currentColor"
        ></path>
      } @else {
        <path
          d="M5.75 3h12.5A2.75 2.75 0 0 1 21 5.75v12.5A2.75 2.75 0 0 1 18.25 21H5.75A2.75 2.75 0 0 1 3 18.25V5.75A2.75 2.75 0 0 1 5.75 3zm0 1.5c-.69 0-1.25.56-1.25 1.25v12.5c0 .69.56 1.25 1.25 1.25h12.5c.69 0 1.25-.56 1.25-1.25V5.75c0-.69-.56-1.25-1.25-1.25H5.75z"
          fill="currentColor"
        ></path>
      }
    </g>
  </svg>
</div>
<div class="line-select-overlay-container">
  <div #outerContainer class="line-select-overlay">
    <div #innerContainer class="lines">
      @for (line of lines(); track line.name) {
        <div
          class="line-button"
          [class.active]="line.checked"
          (click)="handleAction(line)"
        >
          <div class="line-font">{{ line.name }}</div>
        </div>
      }
    </div>
  </div>

  @if (directorVisible) {
    @if (leftVisible) {
      <div class="left-arrow" (click)="handleScroll('left')">
        <img
          src="assets/images/cocc/direct-arrow.png"
          alt=""
          draggable="false"
        />
      </div>
    }
    @if (rightVisible) {
      <div class="right-arrow" (click)="handleScroll('right')">
        <img
          class="rotate-180"
          src="assets/images/cocc/direct-arrow.png"
          alt=""
          draggable="false"
        />
      </div>
    }
  }
</div>
